name: mawid
description: MAWID — event management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  provider: ^6.1.2

  # UI / utils
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Config for flutter_native_splash — generates the actual native
# (pre-Flutter-boot) splash screen for Android/iOS, using the real
# exported logo PNG, not a hand-coded shape. This is separate from and
# earlier than the in-app splash in lib/main.dart: this is what shows
# while the OS is still launching the app, before Flutter's engine has
# even started drawing anything.
#
# web: false — deliberately not generating a web splash here. Web
# doesn't have an equivalent "native pre-boot" moment the way
# Android/iOS do, and generating one risks fighting with the timed
# 2.5s Dart-side splash in main.dart, which is what actually controls
# the branded splash experience on web. One splash mechanism per
# platform, not two competing ones.
#
# To generate/update it after changing this config or the image, run:
#   flutter pub get
#   dart run flutter_native_splash:create
# (This edits native Android/iOS files directly — must be run locally,
# not something that can be pre-baked into the zipped source files.)
flutter_native_splash:
  color: "#05070D"
  image: assets/images/mawid_mark.png
  web: false
  android_12:
    color: "#05070D"
    image: assets/images/mawid_mark.png

# Config for flutter_launcher_icons — generates the actual app icon
# (home screen icon on Android/iOS, browser tab favicon + PWA icons on
# web) from the same real logo PNG, not a separate hand-made asset. One
# source image, every platform's icon derived from it.
#
# To generate/update after changing this config or the image, run:
#   flutter pub get
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/mawid_mark.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/mawid_mark.png"
    background_color: "#05070D"
    theme_color: "#05070D"